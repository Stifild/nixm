name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Парсинг + форматирование всех .nix файлов
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Parse + format-check .nix files
        # nix-instantiate --parse проверяет синтаксис каждого файла;
        # nix fmt --check — формат по rfc-style. Оба пробрасывают ненулевой код при ошибке.
        run: |
          set -euo pipefail
          while read -r f; do
            nix-instantiate --parse "$f" >/dev/null
          done < <(find . -type f -name '*.nix' -not -path './.git/*')
          nix fmt --check .

  # Сборка каждой nixosConfigurations из flake.nix
  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build all host configurations
        run: |
          set -euo pipefail
          # nix build в flake собирает все nixosConfigurations сразу.
          nix build --print-build-logs
