name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Парсинг + форматирование всех .nix файлов
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Parse .nix files
        # nix-instantiate --parse проверяет синтаксис каждого файла.
        run: |
          set -euo pipefail
          while read -r f; do
            nix-instantiate --parse "$f" >/dev/null
          done < <(find . -type f -name '*.nix' -not -path './.git/*')

      - name: Format-check .nix files
        # `nix fmt` — встроенная подкоманда (Nix >= 2.35), ставит formatter вместе
        # с самим Nix; проверка по rfc-style, ненулевой код при расхождении.
        run: nix fmt --check .

  # Сборка каждой nixosConfigurations из flake.nix
  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build all host configurations
        run: |
          set -euo pipefail
          # nix build в flake собирает все nixosConfigurations сразу.
          nix build --print-build-logs
